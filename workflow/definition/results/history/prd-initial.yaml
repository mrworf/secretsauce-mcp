findings:
- id: F-PRD-001
  significance: MATERIAL
  summary: Secret-in-URL prohibition conflicts with required capability links and
    preserved query credential placement.
  affected_requirement: SEC-01
  affected_requirements: &id001
  - SEC-01
  - IDENT-03
  - IDENT-05
  - BASE-01
  affected_artifact: docs/web-console-prd.md
  evidence: SEC-01; IDENT-03/05; BASE-01; docs/config-reference.md credential usage.enforce
    description
  why_it_matters: Distinct implementations could prohibit required links or remove
    existing downstream placement, or leak management secrets.
  local_correction_possible: false
  reconciliation_required: false
- id: F-PRD-002
  significance: MATERIAL
  summary: Clean-host restore does not define how a recovery Owner authenticates without
    restored MFA or live sessions.
  affected_requirement: BACKUP-03
  affected_requirements: &id002
  - BACKUP-03
  - BACKUP-04
  - BACKUP-05
  - AUTHZ-03
  - IDENT-01
  - IDENT-05
  affected_artifact: docs/web-console-prd.md
  evidence: BACKUP-01 excluded data; BACKUP-05 authenticated recovery Owner and fresh
    enrollment
  why_it_matters: Recovery may deadlock or allow unauthenticated takeover; final Owner
    and service resumption cannot be tested.
  local_correction_possible: false
  reconciliation_required: false
- id: F-PRD-003
  significance: MATERIAL
  summary: Audit failure repair-access exception lacks a bounded authentication and
    mutation contract.
  affected_requirement: AUDIT-01
  affected_requirements: &id003
  - AUDIT-01
  - AUDIT-04
  - IDENT-02
  - IDENT-05
  - SEC-03
  affected_artifact: docs/web-console-prd.md
  evidence: AUDIT-04 preserves access needed to repair storage; AUDIT-01 requires
    security-event recording
  why_it_matters: Implementers could enable unaudited privileged mutation or eliminate
    the promised recovery access.
  local_correction_possible: false
  reconciliation_required: false
- id: F-PRD-004
  significance: MATERIAL
  summary: Draft/apply scope and rollback permissions do not distinguish immediate
