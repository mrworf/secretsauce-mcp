questions:
- id: UX-DESIGN-003
  kind: UX_DIRECTION_APPROVAL
  blocking: true
  affected_requirement: UX-02/03/04; IDENT-05; BACKUP-02
  affected_surfaces:
  - Settings
  - People & Access
  - service creation
  question: Approve the proposed populated-form Settings and account list/detail direction shown
    in feedback-002-draft-1?
  reason: Changes editing structure, save-state presentation, terminology and account information
    hierarchy beyond previously approved UX2.
  recommendation: Populated current-value forms; Review changes then Apply, with existing save-only
    capability labeled Save for later; useful wider layouts; compact account list and full detail.
  alternatives:
  - option: retain summary-first editing
    tradeoff: Preserves read-first scanning but keeps a separate Edit step and duplicate value presentation.
  options:
  - approve recommended direction
  - request adjustments
  proposal_paths:
  - workflow/definition/drafts/product-ux/web-console-feedback-002/index.md
