delivery_constraints:
  granularity: coherent_integrated_outcomes
  slice_boundary: one_independently_verifiable_behavior
  split_trigger: distinct_substantial_outcome_or_material_risk_boundary
  validation: focused_during_iteration_broader_at_required_checkpoint
  contract:
  - Before production edits, minimal-slice-delivery records each observable behavior, exclusions, focused positive/negative
    evidence and commit boundary; keep necessary layers and related same-pattern support together.
  - Revise remaining slice plans before absorbing another behavior; tests and fixes proving the same behavior remain
    together. Complete and commit verified outcomes without relabeling remaining acceptance.
  - Slice refinements stay within milestone authority; scope/dependency changes return to planning and preserve
    completed history.
  - Run focused checks during iteration and broader regression at its planned stable boundary; repeat passing checks
    only for relevant changes, failures, unresolved risks or required gates.
  - Demonstrate integrated behavior at the earliest dependency-safe checkpoint. Synthetic fixtures do not prove
    real external interoperability.
  - First confirmed out-of-area regression expands focused scope; second distinct regression or further spread requires
    full regression after focused repair.
