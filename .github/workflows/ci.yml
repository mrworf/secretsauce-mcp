name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: secretsauce-mcp

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-image:
    needs: [quality-gates, docker-browser-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run amd64 container smoke
        if: matrix.arch == 'amd64'
        run: npm run smoke:container

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: node scripts/docker-metadata.mjs

      - name: Build native architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Publish temporary architecture-specific tags, then assemble one multi-arch manifest.
          tags: ghcr.io/mrworf/secretsauce-mcp:build-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-image-${{ matrix.arch }}

  docker-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: node scripts/docker-metadata.mjs

      - name: Publish multi-architecture manifest
        env:
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$DOCKER_TAGS"
          args=()
          for tag in "${tags[@]}"; do
            if [[ -n "$tag" ]]; then args+=(-t "$tag"); fi
          done
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" \
            "ghcr.io/mrworf/secretsauce-mcp:build-${GITHUB_SHA}-amd64" \
            "ghcr.io/mrworf/secretsauce-mcp:build-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${tags[0]}"

  docker-browser-e2e:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local Docker browser journey
        run: npm run test:e2e:docker
