experience:
  revision: web-console-ux-4
  audience:
    primary:
    - Owners
    - Administrators
    secondary:
    - Auditors
    - Members within existing scope
  principles:
  - Show known current values directly in forms
  - Use plain action and state language
  - Use desktop width for useful related content
  - Preserve deliberate review and security boundaries
  - Separate service lifecycle, credential readiness and pending configuration
  - Use focused service sections and contextual credential/rule dialogs
  product_character:
    tone: Plain, calm, precise
    density: Moderate density; compact one-row account list
    complexity_strategy: Focused sections and named advanced controls; no routine JSON
    guidance_level: Short associated help and concrete consequences
  information_priorities:
  - Current versus pending versus unsaved state
  - The next action needed to make changes take effect
  - Role-permitted account details and current health
  interaction_direction:
    navigation: Preserve four primary areas and six focused Settings sections; rename Response protection to Secret
      detection
    routine_actions: Populated forms; Review changes saves pending work then opens complete-scope review; Save for
      later retains existing persistence-only option
    consequential_actions: Apply reviewed Settings atomically; confirm immediate account operations separately
    progressive_disclosure: Preserve all advanced capabilities without putting raw structure in routine paths
    service_configuration: Focused populated sections, clickable creation steps, one global Guided/Advanced mode,
      compact rule list and explicit in-draft import recovery
  responsive_priority: Use columns on wide screens, reflow forms and keep compact account rows linked to complete
    detail on narrow screens
  explicit_po_preferences:
  - statement: Plain understandable language and useful horizontal space
    decision_refs:
    - PO-FB-016
    - PO-FB-017
  - statement: One row per user, detail editing, creation and last login
    decision_refs:
    - PO-FB-023
    - PO-FB-024
    - PO-FB-025
    - PO-FB-026
    - PO-FB-027
  - statement: Support unencrypted SMTP; never prefill saved password
    decision_refs:
    - PO-FB-031
    - PO-FB-034
  - statement: Actual UX must generally match the appearance of approved mockups; meaningful visual drift needs
      correction or explicit accepted exception
    decision_refs:
    - UX-DESIGN-003
  - statement: Approved feedback 003 service configuration direction and representative visual appearance
    decision_refs:
    - UX-DESIGN-004
  - statement: Referenced credential Delete clears its value and retains its key, with the consequence explained
      before confirmation
    decision_refs:
    - PO-FB-065
    - PO-FB-066
  explicit_po_dislikes:
  - statement: Extra viewing/editing steps and inconsistent values/state
    decision_refs:
    - PO-FB-035
    - PO-FB-039
    - PO-FB-041
  designer_discretion:
  - Routine geometry, spacing and typography refinements within the approved general appearance
  - Minor rendering differences that do not change composition, hierarchy, density or accessibility
  approval:
    approved: true
    decision_refs:
    - UX-DESIGN-001
    - UX-DESIGN-002
    - UX-DESIGN-003
    - UX-DESIGN-004
