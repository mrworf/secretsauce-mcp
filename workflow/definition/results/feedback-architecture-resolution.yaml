proposed_prd_clarifications:
- requirement: IDENT-04
  text: 'SMTP credential deletion is an explicit write-only action independent of configuration Apply. SMTP credential
    creation and replacement retain their existing draft/review/apply workflow, bound to the current configuration
    revision and credential version. Only a recently authenticated Owner can confirm deletion of the current credential
    version. Enabled SMTP that depends on the value blocks deletion: disable SMTP through its settings review/apply
    first, then use Delete SMTP credential. Disabling SMTP retains its saved settings and encrypted credential;
    deletion preserves non-secret settings and never silently enables anonymous delivery. Manual link delivery remains
    available under the authorized recovery/invitation flow.'
- requirement: CONFIG-03
  text: The STATE-01/02/03 SMTP amendment applies to SMTP credentials as well as service values. Deletion rechecks
    current authorization, recent authentication, audit readiness, configuration revision, credential version and
    dependencies. Success removes live and pending copies of the value, advances revisions and invalidates reviews;
    preserved non-secret drafts require fresh review. Stale confirmations, drafts, browser submissions and history
    cannot resurrect deleted values. Delivery queued before a change must recheck current admission; already-dispatched
    mail may finish under its admitted revision without rewriting credentials. Audit failure blocks mutation; uncertain
    persistence never reports success or permits new use of an unresolved credential. A later creation/replacement
    requires fresh value entry into a current draft and ordinary review/apply; reloading an old draft cannot silently
    rebase its pending secret across deletion or replacement.
- requirement: CONFIG-04
  text: SMTP credential values are excluded from configuration history, and rollback cannot restore a deleted SMTP
    value. This does not promise retroactive removal from encrypted backup archives; explicit whole-instance restore
    retains its existing restricted review and reactivation requirements.
cross_specialist_coordination:
  security: Security specialist confirmed no conflict with SMTP deletion boundary. Its REC-DEC-001 reset contract
    owns target/issuer generation and factor requirements; SMTP management remains Owner-only.
  reset_persistence_note: Existing STATE-01/02/03 ordering and non-resurrection apply to reset-induced eligibility/revocation;
    no duplicate reset contract is introduced here.
