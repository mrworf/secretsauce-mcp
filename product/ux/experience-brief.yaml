experience:
  revision: web-console-ux-10
  audience:
    primary:
    - Owners
    - Administrators
    secondary:
    - Auditors
    - Members within existing scope
  principles:
  - Show known current values directly in forms
  - Use plain action and state language
  - Use desktop width for useful related content
  - Preserve deliberate review and security boundaries
  - Separate service lifecycle, credential readiness and pending configuration
  - Use focused service sections and contextual credential/rule dialogs
  - Compare service changes by section and keep full proposed settings in a separate tab
  product_character:
    tone: Plain, calm, precise
    density: Moderate density; compact one-row account list
    complexity_strategy: Focused sections and named advanced controls; no routine JSON
    guidance_level: Short associated help and concrete consequences
  information_priorities:
  - Current versus pending versus unsaved state
  - The next action needed to make changes take effect
  - Role-permitted account details and current health
  interaction_direction:
    navigation: Preserve four primary areas and six Settings sections; five Limits categories and persistent
      search dialog under UX-DESIGN-006.
    routine_actions: Populated forms; Review changes saves pending work then opens complete-scope review; Save
      for later retains existing persistence-only option
    consequential_actions: Apply reviewed Settings atomically; confirm immediate account operations separately
    progressive_disclosure: Preserve all advanced capabilities without putting raw structure in routine paths
    service_configuration: Four direct sections share Settings-style persistent status/Discard/Save for later/Review
      changes; actual incomplete review has exact fix links and unavailable approval.
    service_review: New settings first/default with complete section cards; Changes retains paired Before/After;
      actual exception bullets precede Approve changes and separate required modal acknowledgments
    settings_actions: One persistent white bottom bar with status, Discard, Save for later and Review changes;
      safe multi-form state retained.
    activity: Shared removable chips with positive alternatives and veto exclusions; fixed contextual scope
      and last-successful-query export.
    service_lifecycle: Shared name and Active/Inactive/Archived lifecycle, independent saved Draft and parent/section
      issue markers; no Back to Services controls.
    service_import: Create separate initially unassigned drafts with readable collision names; no identity-mapping
      task; zero assignments valid.
    credential_removal: Named button/modal stages removal; exact reviewed Apply deletes only intentionally
      removed unreferenced saved values; independent immediate actions and SMTP exception remain.
    permanent_deletion: Archived-only typed confirmation removes current service/configuration/secrets; retained
      audit/backups and explicit restore remain separate.
    sign_in: Compact task form; ordinary recovery-code sign-in remains distinct from Replace authenticator.
  responsive_priority: Use columns on wide screens, reflow forms and keep compact account rows linked to complete
    detail on narrow screens
  explicit_po_preferences:
  - statement: Plain understandable language and useful horizontal space
    decision_refs:
    - PO-FB-016
    - PO-FB-017
  - statement: One row per user, detail editing, creation and last login
    decision_refs:
    - PO-FB-023
    - PO-FB-024
    - PO-FB-025
    - PO-FB-026
    - PO-FB-027
  - statement: Support unencrypted SMTP; never prefill saved password
    decision_refs:
    - PO-FB-031
    - PO-FB-034
  - statement: Actual UX must generally match the appearance of approved mockups; meaningful visual drift needs
      correction or explicit accepted exception
    decision_refs:
    - UX-DESIGN-003
  - statement: Approved feedback 003 service configuration direction and representative visual appearance
    decision_refs:
    - UX-DESIGN-004
  - statement: Referenced credential Delete clears its value and retains its key, with the consequence explained
      before confirmation
    decision_refs:
    - PO-FB-065
    - PO-FB-066
  - statement: Approved feedback 004 service comparison composition, narrow paired stacking and confirmation
      appearance
    decision_refs:
    - UX-DESIGN-005
  - statement: New settings first/default; actual review exception bullets visible before approval; remove
      standalone guided Secret detection; highlight every explicit scanning override
    decision_refs:
    - PO-REFINEMENT-010
    - PO-FB-138
    - PO-FB-140
    - PO-FB-145
    - PO-FB-146
  - statement: Approve five Limits categories and a persistent Settings search action/dialog, preserving established
      style and safeguards.
    decision_refs:
    - UX-DESIGN-006
    - REC-DEC-011
    - REC-DEC-012
  - statement: One Settings footer, named credential cards/value status, concise policy layout/copy, shared
      Activity chips and task-specific exports.
    decision_refs:
    - PO-REFINEMENT-013
  - statement: Reuse Settings action bar for service editing, direct sections, actionable incomplete review,
      precise discard and separate lifecycle/draft state; independent unassigned imports.
    decision_refs:
    - PO-REFINEMENT-014
    - UX9-SERVICE-SEMANTICS
  - statement: Distinct no-access advisory; named credential removal dialog and Apply cleanup; typed Archived
      deletion; stable Settings switching; remove duplicate Overview actions and generic saved-value helper.
    decision_refs:
    - PO-REFINEMENT-015
  explicit_po_dislikes:
  - statement: Extra viewing/editing steps and inconsistent values/state
    decision_refs:
    - PO-FB-035
    - PO-FB-039
    - PO-FB-041
  - statement: Service review presented as a massive wall of text
    decision_refs:
    - PO-FB-126
  designer_discretion:
  - Routine geometry, spacing and typography refinements within the approved general appearance
  - Minor rendering differences that do not change composition, hierarchy, density or accessibility
  - "Compact sign-in geometry within short-input pattern and existing recovery task naming, based on PO-FB-271\u2013\
    274; no new authentication flow."
  approval:
    approved: true
    decision_refs:
    - UX-DESIGN-001
    - UX-DESIGN-002
    - UX-DESIGN-003
    - UX-DESIGN-004
    - UX-DESIGN-005
    - PO-REFINEMENT-010
    - UX-DESIGN-006
    - PO-REFINEMENT-013
    - PO-REFINEMENT-014
    - UX9-SERVICE-SEMANTICS
    - PO-REFINEMENT-015
    - UX10-DELETION-SEMANTICS
    scope: "Preserve UX9 approved appearance and task patterns; adopt confirmed feedback265\u2013281 and D10-01\u2013\
      05 as the bounded UX10 delta."
