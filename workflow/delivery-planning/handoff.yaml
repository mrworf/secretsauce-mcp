delivery_constraints:
  granularity: coherent_integrated_outcomes
  slice_boundary: one_independently_verifiable_behavior
  split_trigger: distinct_substantial_outcome_or_material_risk_boundary
  validation: focused_during_iteration_broader_at_required_checkpoint
  contract:
  - Before production edits, minimal-slice-delivery records each observable behavior,
    exclusions, focused positive/negative evidence and commit boundary; keep necessary
    layers and related same-pattern support together.
  - Revise remaining slice plans before absorbing another behavior; tests and fixes
    proving the same behavior remain together. Complete and commit verified outcomes
    without relabeling remaining acceptance.
  - Slice refinements stay within milestone authority; scope/dependency changes return
    to planning and preserve completed history.
  - Run focused checks during iteration and broader regression at its planned stable
    boundary; repeat passing checks only for relevant changes, failures, unresolved
    risks or required gates.
  - Demonstrate integrated behavior at the earliest dependency-safe checkpoint. Synthetic
    fixtures do not prove real external interoperability.
  - First confirmed out-of-area regression expands focused scope; second distinct
    regression or further spread requires full regression after focused repair.
  regression_plan:
    source: delivery/milestones/secretsauce-mcp/status.yaml#regression_checkpoints
    checkpoints:
      UX7-INTEGRATED:
        covered_milestones:
        - '41'
        - '42'
        - '43'
        - '44'
        status: pending
        due: After all four outcomes and before release/local deployment or final
          packet acceptance; a bounded stop leaves this obligation pending.
        categories:
        - full unit/integration suite
        - build
        - joined service import-correct-review and Settings search-edit-review browser
          journeys
        - SMTP timing/dependency browser regression
        - role/error/navigation/accessibility and visual comparison
        commands:
        - npm test -- --maxWorkers=2
        - npm run build
        execution: Frozen source, no concurrent browser/Docker workloads during full
          suite. Run browser checks separately with synthetic isolated HTTPS fixtures.
        evidence: Record exact revision, focused versus broad qualification, commands/results
          and matching approved/runtime visual comparisons.
        escalation: First confirmed out-of-area regression expands focused scope;
          second distinct regression or further spread requires full suite after focused
          repair.
        conditional: Transport changes require actual self-signed HTTPS test; recovery/launcher
          changes require existing Docker restart/recovery gates. No new external
          LLM dependency for presentation-only scope.
