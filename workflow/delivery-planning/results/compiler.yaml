    observable_checkpoint: Open Set/Replace from Configuration and creation Authentication, cancel without
      mutation, save immediately, and focus a newly added credential.
    scope_boundary: Shared entry dialogs must agree in both contexts; no new credential storage or admission
      design is assigned here.
    separable_capabilities_kept_separate: true
    granularity_findings: []
  - milestone: '31'
    observable_checkpoint: Add and edit a representative imported rule through the same dialog, select common
      methods and retain custom methods/regex/options while preserving effective order.
    scope_boundary: List and shared Add/Edit are one rule-authoring outcome; safe testing/history are separate.
    separable_capabilities_kept_separate: true
    granularity_findings: []
  - milestone: '32'
    observable_checkpoint: Read context-specific guidance, distinguish a proposed assignment from current execution
      access, and confirm an authorized existing-service access change.
    scope_boundary: Plain guidance is tied to actual field/access consequences rather than a standalone copy
      sweep; it preserves all advanced capabilities and does not repeat destination/rule redesign.
    separable_capabilities_kept_separate: true
    granularity_findings: []
  - milestone: '33'
    observable_checkpoint: Use actual browser Back/Forward and a deep link, run no-I/O policy testing in context,
      return with focus/scroll and safe edits intact.
    scope_boundary: History, tool return and dirty guards share the same editing-context contract; no router-wide
      rewrite or global Settings redesign.
    separable_capabilities_kept_separate: true
    granularity_findings: []
