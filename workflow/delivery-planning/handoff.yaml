  contract:
  - Before production edits persist governing and all slice plans with one observable behavior, exclusions,
    positive/negative evidence and commit boundary per slice.
  - Split newly discovered independent behavior into a subsequent slice before absorbing it; keep strictly
    necessary supporting work with its behavior.
  - Milestone scope/dependency changes return to planning; preserve completed work and every acceptance
    requirement.
