proposed_prd_clarifications:
  - requirement: CONFIG-03
    clarification: Draft/apply covers configuration; immediate authorized identity, grant, credential-value, disable, and revocation actions do not wait for apply. Apply rechecks current actor rights and relevant dependencies, rejects stale work, and cannot mix configuration revisions at request admission.
  - requirement: CONFIG-04
    clarification: History excludes live access/lifecycle state and secret values; rollback cannot revive revoked access or enable services and is limited to current actor authority.
  - requirement: AUTHZ-02
    clarification: Current authorization is checked at dispatch admission; already-dispatched work may complete under its original revision and response protection, without reviving invalidated references.
  - requirement: BACKUP-02
    clarification: Completed backups identify one consistent recoverable state and audit boundary; partial output cannot be successful.
  - requirement: BACKUP-04
    clarification: Freeze admission and quiesce within existing deadlines; preserve a protected local installation rollback source distinct from export backups, validate installation atomically, and remain recoverable through interruption.
  - requirement: BACKUP-05
    clarification: Separate restricted restore continuation from normal login; fresh recovery Owner enrollment and audit readiness enable management, with other users and services requiring explicit review/reactivation.
  - requirement: BACKUP-06
    clarification: Preserve local audit events independently of snapshot replacement; label imported evidence and explicitly identify clean-host gaps.
