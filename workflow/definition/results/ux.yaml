  canonical_adoption_scope_after_approval:
  - scope: People and assisted reset visibility
    targets:
    - product/ux/01-information-architecture.md
    - product/ux/07-acceptance-checklist.md
    source: AUTHZ-02/03, IDENT-05, SECRES-05; REC-RM-003
    required_rules: Owner can target other eligible human users including Owners. Administrator sees only the non-secret
      list/detail needed for non-Owner reset targets. Expose distinct Reset password and Reset Authenticator actions;
      no invitation, role/contact changes, disable/reactivate, restore-review or general grant-revocation expansion.
  - scope: Separate reset ceremonies and feedback
    targets:
    - product/ux/02-interaction-patterns.md
    - product/ux/05-accessibility.md
    - product/ux/07-acceptance-checklist.md
    source: IDENT-04/05/06, SECRES-05; REC-RM-003
    required_rules: Both assisted actions use recent initiator password/TOTP, trusted-channel verification-category
      confirmation and named target/action confirmation. Password issuance does not lock out; completion needs proof
      plus retained TOTP/recovery code and new password, then revokes old access. MFA issuance immediately restricts
      and revokes; fresh factor/codes completion keeps password and requires normal login. Explain both-lost sequence,
      last-enrolled-Owner protection/host route, 30-minute expiry, manual or SMTP delivery, safe reissue and uncertain-state
      recovery. Never expose target secrets or generalize expired issuer browser session into proof invalidation.
  - scope: Independent SMTP deletion
    targets:
    - product/ux/02-interaction-patterns.md
    - product/ux/06-feature-exceptions.md
    - product/ux/07-acceptance-checklist.md
    source: IDENT-04/06, CONFIG-03/04, STATE-01/02/03 SMTP amendment; REC-RM-004
    required_rules: Keep SMTP value creation/replacement in draft/review/apply. Owner-only Delete SMTP credential
      is separate from Save/Apply, recent-authenticated, version-bound and confirmed. Explain enabled dependency
      and link to disable through review/apply before deletion. Preserve non-secret settings, distinguish missing/already-absent
      and uncertain outcome, require draft refresh and fresh secret entry after deletion, never imply history recovers
      the value. Service value actions retain existing immediate semantics.
  - scope: Settings sections and friendly controls
    targets:
    - product/ux/01-information-architecture.md
    - product/ux/02-interaction-patterns.md
    - product/ux/03-responsive-and-platform.md
    - product/ux/07-acceptance-checklist.md
    source: UX-02, PO-FB-008/011; REC-DEC-002 plus pending UX-DESIGN-002
    required_rules: After approval only, synthesize exact proposed six-section navigation, selected state, search/unsaved-navigation
      guard, same-draft complete-scope review, readable summaries and capability-to-control map. Preserve advanced
      literal values and role scope; no JSON default, no lossy form conversion, no invented per-section partial
      apply. Narrow selector and wrap/reflow follow reviewed concepts.
  - scope: Active navigation
    targets:
    - product/ux/01-information-architecture.md
    - product/ux/04-visual-system.md
    - product/ux/05-accessibility.md
    - product/ux/07-acceptance-checklist.md
    source: UX-01/04, PO-FB-006; REC-RM-001
    required_rules: Existing current-location and selected-state rules already establish active navigation. Retain
      them and clarify visible non-color plus programmatic selection at global/section/service-tab scope; no new
      redesign approval or alternate shell.
  - scope: Legacy import discoverability and preservation
    targets:
    - product/ux/01-information-architecture.md
    - product/ux/02-interaction-patterns.md
    - product/ux/07-acceptance-checklist.md
    source: MIGRATE-01 through MIGRATE-04, PO-FB-014; REC-RM-002
    required_rules: Retain import from Services and Configuration tools, main legacy YAML and both optional catalog
      inputs, role-scoped draft validation, field/source errors, explicit credential/identity resolution, sanitized
      review and no silent activation or host source reads. Preserve original semantics, identifiers and exceptions;
      friendly imported summaries do not replace source validation.
  - scope: UX authority publication after direction
    targets:
    - product/ux/manifest.yaml
    - product/ux/experience-brief.yaml
    - product/ux/00-overview.md
    source: Product UX approval and artifact contracts
    required_rules: After existing UX-DESIGN-002 is approved, publish one coherent bounded revision with exact current
      authority hashes and decision provenance. Preserve UX-DESIGN-001 character and unaffected rules. No active
      manifest/source revision change while approval is pending.
