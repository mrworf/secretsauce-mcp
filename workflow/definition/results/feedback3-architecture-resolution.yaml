proposed_prd_clarifications:
- requirement: CONFIG-02 / CONFIG-03
  text: Referenced service credential Delete clears only its value and retains its exact key; count applied and
    saved proposed dependencies, state the outcome before confirmation, and reject changed dependency/version confirmations.
    Only unreferenced keys can be removed. Missing applied values block execution without silently changing lifecycle
    or authentication; immediate Set restores only otherwise eligible execution. SMTP remains unchanged. STATE-09
    defines atomicity, stale references and restart fencing.
- requirement: CONFIG-02 / AUDIT-01
  text: Show last successful Set/Replace/Clear actor and time without values; preserve stable attribution across
    actor changes, Unknown for legacy missing data, and historical source distinction after restore.
- requirement: BACKUP-01 / BACKUP-05
  text: Preserve missing-value/generation state consistently without stale normalized secret copies; archived older
    values remain recoverable only through existing explicit whole-instance restore with disabled services and review.
    Restore does not fabricate new mutation attribution.
