        status: pending
        due: After M52 and before deployment/final acceptance; bounded stops retain this obligation.
        categories:
        - full unit/integration suite and build
        - joined initial/current Access and preserved complete-draft navigation browser qualification
        - role/CSRF/eligibility/stale/unknown and current-grant preservation
        - matching UX11 width/dialog/keyboard/narrow/enlarged-text visual comparison
        commands:
        - npm test -- --maxWorkers=2
        - npm run build
        execution: Clean frozen tracked source; no concurrent browser/Docker during full suite. Disposable synthetic
          HTTPS browser separately.
        conditional: Actual self-signed HTTPS if transport changes; existing old-reader/recovery/backup/restart/Docker
          gates only if those boundaries change. No state format assumed for UI.
        escalation: First unexpected out-of-area regression expands focused checks; second distinct regression or
          spread triggers full regression after repairs.
