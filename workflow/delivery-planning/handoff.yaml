        status: pending
        due: After both outcomes and before deployment/final packet acceptance; bounded stop leaves broader
          qualification pending.
        categories:
        - full unit/integration suite and build
        - joined service/Settings edit-state and Activity search-detail-export browser qualification
        - Member and evidence-role scope, audit denials and SMTP timing regression
        - matching-state UX8 visual/keyboard/narrow/enlarged-text comparison
        commands:
        - npm test -- --maxWorkers=2
        - npm run build
        execution: Frozen sources; no concurrent browser/Docker workloads during full suite. Synthetic
          isolated HTTPS browser checks separately.
        evidence: null
        escalation: First confirmed unexpected out-of-area regression expands focused scope; second distinct
          regression or spread requires full regression after focused repairs.
        conditional: Actual self-signed HTTPS if transport changes; existing Docker recovery gates if
          recovery/launcher changes; no new external LLM dependency.
