  local_correction_possible: false
  reconciliation_required: false
questions:
- id: Q-PRD-001
  source_finding_ids:
  - F-PRD-001
  blocking: true
  affected_requirement: SEC-01
  affected_requirements: *id001
  affected_artifact: docs/web-console-prd.md
  question: Derive the narrow URL/token exposure contract preserving enrollment/recovery
    links, OAuth flows, and supported gateway query placement.
  reason: Distinct implementations could prohibit required links or remove existing
    downstream placement, or leak management secrets.
  options:
  - Define purpose-bound short-lived capability exceptions with leakage controls while
    prohibiting ordinary credential exposure
  - Return a precise remaining product choice only if the established requirements
    cannot coexist
  resolution_category: SPECIALIST_RESOLUTION
  resolution_owner:
  - security
  depends_on: []
  ask_user: false
- id: Q-PRD-002
  source_finding_ids:
  - F-PRD-002
  blocking: true
  affected_requirement: BACKUP-03
  affected_requirements: *id002
  affected_artifact: docs/web-console-prd.md
  question: Derive recovery proof, restricted Owner enrollment, and activation transitions
    for clean-host and in-place restore.
  reason: Recovery may deadlock or allow unauthenticated takeover; final Owner and
    service resumption cannot be tested.
  options:
  - Use established host/bootstrap and backup recovery authority in a restricted restore
    ceremony
  - Identify only any residual consequential product tradeoff that cannot be derived
  resolution_category: SPECIALIST_RESOLUTION
  resolution_owner:
  - security
  - architecture
  depends_on: []
  ask_user: false
- id: Q-PRD-003
  source_finding_ids:
  - F-PRD-003
  blocking: true
  affected_requirement: AUDIT-01
  affected_requirements: *id003
  affected_artifact: docs/web-console-prd.md
  question: Specify allowed read-only/recovery access and prohibited changes while
    durable audit is unavailable, plus verified resumption.
  reason: Implementers could enable unaudited privileged mutation or eliminate the
    promised recovery access.
  options:
  - Restrict outage access to diagnosis and operator repair with durable recording
    before sensitive work resumes
  - Identify only any residual safety-versus-availability product choice
  resolution_category: SPECIALIST_RESOLUTION
  resolution_owner:
  - security
  - architecture
  depends_on: []
  ask_user: false
- id: Q-PRD-004
  source_finding_ids:
  - F-PRD-004
  blocking: true
  affected_requirement: CONFIG-02
  affected_requirements: *id004
  affected_artifact: docs/web-console-prd.md
  question: Derive draft transaction and immediate-operation boundaries, apply-time
    actor checks, scoped rollback and related lifecycle invalidation.
  reason: Revocation could wait for apply, or an Administrator could apply/rollback
    Owner-only settings through a mixed draft.
  options:
  - Preserve immediate security actions and restrict draft/apply/rollback to the acting
    role permitted configuration
  - Surface a remaining product choice only if simpler safe semantics cannot satisfy
    the existing matrix
  resolution_category: SPECIALIST_RESOLUTION
  resolution_owner:
  - architecture
  - security
  depends_on: []
  ask_user: false
