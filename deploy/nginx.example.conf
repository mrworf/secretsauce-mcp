# Install on an HTTPS proxy under operator control. Replace only example.org names.
# No access/error detail logging: tokens, headers, cookies and request bodies stay out.
server {
    listen 443 ssl;
    server_name mcp.example.org;
    ssl_certificate /etc/nginx/keys/tls.crt;
    ssl_certificate_key /etc/nginx/keys/tls.key;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    location /console {
        # Example private administration network; adjust explicitly to operator policy.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/secretsauce-proxy-headers.conf;
    }
    location / {
        # Public MCP, OAuth authorization/token/metadata and static brand routes.
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        include /etc/nginx/secretsauce-proxy-headers.conf;
    }
}
