services:
  secretsauce-vault:
    # The vault has its own process and container mount namespace and no TCP port.
    build: .
    image: secretsauce-mcp:latest
    command: ["node", "dist/vault/main.js"]
    user: "0:0"
    network_mode: "none"
    volumes:
      - ./examples/vault.yaml:/config/vault.yaml:ro
      # The root entrypoint is the sole generator, then drops to UID/GID 1001.
      - vault-generated:/var/lib/secretsauce/generated
      - vault-setup-state:/var/lib/secretsauce/setup
      # The entrypoint assigns the runtime socket path to UID 1001/shared GID.
      - ./vault-runtime:/run/secretsauce-vault
      - ./vault-store:/var/lib/secretsauce/vault
      # Retained-state adapters receive read-only inventory views.
      - ./database:/inventory/database:ro
      - ./audit:/inventory/audit:ro
      - ./oauth-state:/inventory/oauth:ro
    environment:
      SECRETSAUCE_VAULT_CONFIG: /config/vault.yaml
      SECRETSAUCE_VAULT_STATUS_SOCKET: /run/secretsauce-vault/status.sock
      SECRETSAUCE_VAULT_OWNER_UID: "1001"
    healthcheck:
      test: ["CMD", "node", "dist/vault/healthCli.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  secretsauce:
    # One application process owns both listeners and the single SQLite writer.
    # Runtime references are instance-local; sticky sessions do not replace the
    # unimplemented shared atomic capability store.
    deploy:
      replicas: 1
    user: "1000:1000"
    group_add:
      - "1002"
    build: .
    image: secretsauce-mcp:latest
    depends_on:
      secretsauce-vault:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./examples/config.yaml:/config/config.yaml:ro
      # Replace this mount source with a custom extend/replace rules file as needed.
      - ./config/secretlint.yaml:/config/secretlint.yaml:ro
      # Sensitive-name rules use the same immutable-default/custom-read-only pattern.
      - ./config/sensitive-names.yaml:/config/sensitive-names.yaml:ro
      - ./secrets:/run/secrets:ro
      # Stable read-only signing keys keep built-in OAuth access tokens valid after restart.
      - ./oauth:/run/oauth:ro
      # Audit and hash-only OAuth refresh state need writable persistent storage.
      - ./audit:/var/lib/secretsauce/audit
      # Mount the configured SQLite parent directory when persistence is enabled.
      - ./database:/var/lib/secretsauce/database
      # This refresh-state mount has a single-process writer contract.
      - ./oauth-state:/var/lib/secretsauce/oauth
      # gref_/sec_ capability state is intentionally ephemeral and is not mounted.
      # Runtime and backup coordination receive separate least-privilege key pairs.
      - vault-generated:/var/lib/secretsauce/generated:ro
      - vault-setup-state:/var/lib/secretsauce/setup:ro
      # Restore recovery uses a distinct stable wrapping key.
      - ./restore-keys/recovery.key:/run/restore-keys/recovery.key:ro
      - ./vault-runtime:/run/secretsauce-vault:ro
      # Staged archives and encrypted recovery artifacts require private durable storage.
      - ./restore:/var/lib/secretsauce/restore
    environment:
      CONFIG_PATH: /config/config.yaml
      SECRETLINT_CONFIG_PATH: /config/secretlint.yaml
      SENSITIVE_NAMES_CONFIG_PATH: /config/sensitive-names.yaml
      SECRETSAUCE_MCP_TOKEN: ${SECRETSAUCE_MCP_TOKEN:?set an ephemeral gateway token}
      SECRETSAUCE_VAULT_CREDENTIAL_SOCKET: /run/secretsauce-vault/credential.sock
      SECRETSAUCE_VAULT_OWNER_UID: "1001"
      SECRETSAUCE_VAULT_MANIFEST_FILE: /var/lib/secretsauce/setup/manifest.json
      SECRETSAUCE_VAULT_KEY_OWNER_UID: "0"
      SECRETSAUCE_VAULT_SHARED_GID: "1002"
      SECRETSAUCE_VAULT_DATA_KEY_FILE: /var/lib/secretsauce/generated/shared/data-plane.key
      SECRETSAUCE_VAULT_CONTROL_KEY_FILE: /var/lib/secretsauce/generated/shared/control-plane.key
      SECRETSAUCE_VAULT_RESOLVE_KEY_FILE: /var/lib/secretsauce/generated/shared/resolve-capability.key
      SECRETSAUCE_VAULT_BACKUP_KEY_FILE: /var/lib/secretsauce/generated/shared/backup.key
      SECRETSAUCE_VAULT_BACKUP_CAPABILITY_KEY_FILE: /var/lib/secretsauce/generated/shared/backup-capability.key
      SECRETSAUCE_RESTORE_DIRECTORY: /var/lib/secretsauce/restore
      SECRETSAUCE_RESTORE_RECOVERY_KEY_FILE: /run/restore-keys/recovery.key
      PORTAINER_API_KEY_FILE: /run/secrets/portainer_api_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vault-generated:
  vault-setup-state:
