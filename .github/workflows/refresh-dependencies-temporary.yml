name: Refresh production dependencies (temporary)

on:
  push:
    branches: [fix/production-dependency-audit]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[deps-refreshed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-dependency-audit
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Update dependencies and lockfile
        run: |
          npm install @modelcontextprotocol/sdk@1.32.2 --save-exact
          npm audit fix || echo "Some advisories may still require manual remediation"
      - name: Commit refreshed dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh MCP SDK and transitive dependencies [deps-refreshed]"
            git push origin HEAD:fix/production-dependency-audit
          fi
      - name: Verify remaining production advisories
        run: npm run audit:production
