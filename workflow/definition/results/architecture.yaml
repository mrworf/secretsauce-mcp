findings:
  - id: ARCH-OBS-01
    significance: OBSERVATION
    summary: Configuration activation needs explicit runtime snapshot/resource lifecycle
    affected_requirement: CONFIG-03
    affected_artifact: docs/web-console-prd.md
    evidence: src/runtime.ts:26; src/server.ts:34; STATE-02
    why_it_matters: Mutable console state can mix configuration or retire protection resources too early
      unless admitted operations retain their coherent context.
    local_correction_possible: false
    reconciliation_required: false
    resolution: Already governed by the authoritative requirements and companion contracts; carry into
      implementation validation. No source correction or new product decision required.
  - id: ARCH-OBS-02
    significance: OBSERVATION
    summary: The current fail-open audit sink must gain durable admission semantics
    affected_requirement: AUDIT-04
    affected_artifact: docs/web-console-prd.md
    evidence: src/audit.ts:110; test/audit.test.ts:222; BASE-02; SECRES-04
    why_it_matters: A successful in-memory event or file write is insufficient proof for the new
      mandatory durable-before-effect contract.
    local_correction_possible: false
    reconciliation_required: false
    resolution: Already governed by the authoritative requirements and companion contracts; carry into
      implementation validation. No source correction or new product decision required.
  - id: ARCH-OBS-03
    significance: OBSERVATION
    summary: Persistence projections must distinguish live access, history, managed secrets and recovery
    affected_requirement: BACKUP-01
    affected_artifact: docs/web-console-prd.md
    evidence: src/tokens.ts:73; src/builtinOAuth.ts:909; src/config.ts:233; STATE-03/04/06
    why_it_matters: Serializing one runtime object would violate declared backup exclusions and could
      revive revoked access.
    local_correction_possible: false
    reconciliation_required: false
    resolution: Already governed by the authoritative requirements and companion contracts; carry into
      implementation validation. No source correction or new product decision required.
  - id: ARCH-OBS-04
    significance: OBSERVATION
    summary: Restore installation must preserve its independent rollback source and audit tail
    affected_requirement: BACKUP-04
    affected_artifact: docs/web-console-prd.md
    evidence: STATE-05/06; J-HOST-RESTORE; J-OWNER-RESUME; UX-IN07
    why_it_matters: Archive validity alone does not establish crash-safe replacement or evidence continuity.
    local_correction_possible: false
    reconciliation_required: false
    resolution: Already governed by the authoritative requirements and companion contracts; carry into
      implementation validation. No source correction or new product decision required.
  - id: ARCH-OBS-05
    significance: OBSERVATION
    summary: Capacity validation must include audit and expensive configurable input workloads
    affected_requirement: OPS-01
    affected_artifact: docs/web-console-prd.md
    evidence: src/policy.ts:48; src/serviceRequestLimiter.ts:4; OPS-02/04; external-input acceptance contract
    why_it_matters: User/service counts alone do not bound retained audit data, regular-expression work
      or archive processing.
    local_correction_possible: false
    reconciliation_required: false
    resolution: Already governed by the authoritative requirements and companion contracts; carry into
      implementation validation. No source correction or new product decision required.
