proposed_prd_clarifications:
- requirement: IDENT-02 / People & Access
  text: Show account creation at durable identity creation and Last console sign-in at successful full console password-and-factor
    session admission. Preserve dates across reissue, recovery and edits. Never denotes a newly tracked account
    with no successful event; missing legacy data is Unknown; external mappings have no local sign-in (Not applicable).
    Metadata is read-only and does not prove authority. STATE-07 defines excluded events and durable recovery semantics.
- requirement: IDENT-04
  text: Owners choose TLS (encrypted, existing implicit TLS and default) or explicit None (unencrypted). Legacy
    missing modes mean TLS; unknown values fail. Ports do not infer mode. Review and delivery preserve exact selection;
    no automatic downgrade. None requires security-defined recent authentication and explicit risk acknowledgment,
    including after restore before new cleartext dispatch. Authentication is independent and password values stay
    write-only. No STARTTLS is required.
- requirement: BACKUP-01 / BACKUP-05
  text: Preserve account metadata as historical snapshot information and SMTP encryption mode. Restore does not
    invent login events, recover missing dates or grant current access from timestamps. Mark restored last-sign-in
    history until a new local qualifying sign-in; old archives with missing dates remain Unknown and missing SMTP
    mode means TLS. Explicit None requires fresh current-Owner review before delivery.
