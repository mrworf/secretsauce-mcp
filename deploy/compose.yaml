# Single active application instance. Provision protected host directories/keys first.
services:
  secretsauce:
    build:
      context: ..
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      CONFIG_PATH: /config/config.yaml
      CONSOLE_STORAGE_DIR: /state
      CONSOLE_KEY_FILE: /keys/console.key
      AUDIT_STORAGE_DIR: /audit
    volumes:
      - ./config:/config:ro
      - ./keys:/keys:ro
      - ./state:/state
      - ./audit:/audit
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
