        - joined Services safe-review and public-reference browser/MCP qualification
        - authorization/namespace/revocation/uncertainty and identity preservation
        - changed format actual prior-reader, restart, owned backup and explicit restore/Docker gates
        - matching UX12 desktop/narrow/enlarged-text keyboard visual comparison
        commands:
        - npm test -- --maxWorkers=2
        execution: Freeze clean tracked candidate; npm test pretest satisfies the build gate. No concurrent Docker/browser
          during full suite. Reuse current final-source browser evidence from the existing source-in-Playwright
          harness. Build one exact application image after the stable suite and reuse it for mandatory affected
