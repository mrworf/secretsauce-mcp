      blocking: true
      resolution_category: SPECIALIST_RESOLUTION
      question: What safe durable credential state and attribution contract realizes
        clear-value/retain-key deletion and last-changed-by display?
      reason: The Product Owner has settled clearing an in-use value and retaining
        its key. Existing authority blocks referenced deletion; current storage conflates
        value presence with metadata. Derive current authorization/version/dependency
        checks, immediate reference/admission effects, failure/restart, restore/history,
        missing-value behavior and honest legacy actor attribution without reopening
        that intent. Security and architecture boundaries both need resolution.
      status: accepted
      resolution_owner:
      - architecture
      - security
      routing_status: resolved
      depends_on: []
      ask_user: false
      resolved_behavior: Referenced service credential Delete clears only value, retains
        key and exact references, reports consequence, and follows STATE-09/SECRES-08
        for durable failure, execution fencing, recovery and actor provenance. SMTP
        remains separate.
      resolution_artifacts:
      - product/architecture/web-console-state-contract.md
      - product/security/web-console-security-contract.md
      - workflow/definition/results/feedback3-architecture-resolution.yaml
      - workflow/definition/results/feedback3-security-resolution.yaml
